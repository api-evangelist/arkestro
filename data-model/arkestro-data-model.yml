write_boundary:
  note: >-
    The read/write split is the most telling thing in this model. Fully writable: Category,
    Item, PurchaseOrder, SupplierContact, Document, Event. Create/update but no delete:
    SupplierOrganization. Read-only: BusinessUnit, Schedule, Award, DocumentSubmission,
    QuoteSubmission, all analytics. An integrator can set up and launch a sourcing event over
    the API, but cannot schedule it, cannot receive quotes through it, and cannot award
    through it — those remain application-side actions.
