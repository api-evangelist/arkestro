note: >-
  Derived by walking the 200-response schemas of all 46 operations in the published OpenAPI
  and reading embedded objects and *_id reference fields as relationships. Arkestro's spec
  inlines every schema into its path files — components.schemas is empty — so entity names
  below are taken from the response envelope keys and path segments, not from named schema
  components. No id-prefix scheme is published; ids are plain integers.
id_convention:
  type: integer
  prefixed: false
  external_id:
    present_on:
    - Event
    - SupplierOrganization
    - SupplierContact
    - PurchaseOrder
    - Item
    - Document
    - DocumentSubmission
    - QuoteSubmission
    - Award
    type: string, nullable
    purpose: >-
      Correlation key for the customer's own system of record. Queryable as a filter on the
      collection endpoints, which is the only duplicate-detection mechanism the API offers
      given there is no request idempotency.
core_domain: >-
  A sourcing Event is the spine. Everything else either configures an event (schedule, lots,
  line items, documents), participates in it (supplier organizations and their contacts,
  quote submissions, document submissions), resolves it (award), or reports on it (the
  analytics data marts). Corporate categories, items and purchase orders form a separate
  reference/spend catalog that events draw on.
