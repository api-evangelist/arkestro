apis:
- name: Arkestro MCP Server
  description: >-
    Remote Model Context Protocol server operated by Arkestro, authorized with OAuth 2.1 authorization
    code flow and mandatory PKCE S256 against the mcp:read, mcp:write and offline_access scopes. The endpoint
    is live but undocumented on any public Arkestro page and its tools/list is authorization-gated, so
    the tool set is not publicly enumerable.
  humanURL: https://api.arkestro.com/.well-known/oauth-authorization-server
  baseURL: https://api.arkestro.com/api/v2/mcp
  tags:
  - mcp
  - procurement
  - agent-native
