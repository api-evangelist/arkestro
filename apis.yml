aid: arkestro
name: Arkestro
description: >-
  Arkestro is a predictive procurement orchestration platform for enterprise sourcing teams,
  applying negotiation science, supplier science and process science to run competitive
  sourcing events at scale. The platform covers sourcing events and their schedules, supplier
  organizations and contacts, corporate item and category catalogs, purchase orders, document
  and quote submissions, awards, and event analytics. It serves automotive, oil and gas,
  high-tech manufacturing, construction, financial services and food and beverage buyers.
  Arkestro publishes a public OpenAPI 3.1.1 contract for its API V2 at api.arkestro.com and
  operates an OAuth 2.1 remote MCP server, though its developer documentation portal sits
  behind a customer sign-in wall.
