apis:
- name: Arkestro API V2
  description: >-
    Public REST API for managing an Arkestro instance without a user session. Covers the
    creation and execution of sourcing events, event schedules and awards, event and
    document submissions, quote submissions, supplier organizations and contacts, corporate
    categories, items and purchase orders, business units, and a set of event analytics
    export and reporting endpoints. Authenticated with an admin-issued Personal Access Token
    in an X-Token header. 46 operations across 26 paths, OpenAPI 3.1.1.
  humanURL: https://api.arkestro.com/api-docs
  baseURL: https://api.arkestro.com
  tags:
  - procurement
  - sourcing
  - supplier-management
  - purchase-orders
  - procurement-analytics
  - e-sourcing
  properties:
