overlay: 1.0.0
info:
  title: API Evangelist enhancements for Arkestro API V2
  version: 1.0.0
extends: openapi/arkestro-api-v2-openapi.yml
x-generated: '2026-08-06'
x-method: generated
x-rationale: 'Arkestro''s published OpenAPI 3.1.1 is unusually complete on content -- every one of the 46 operations
  has a summary, a tag, and declared 2xx/4xx/5xx responses -- but NOT ONE OPERATION HAS AN operationId. That is
  the single highest-leverage defect in the contract: without operationIds, generated SDKs invent method names,
  Arazzo workflows cannot reference steps, MCP tool generators have no stable tool name, and any two code generators
  disagree. This overlay supplies a stable operationId for each operation, derived deterministically from the provider''s
  OWN summary text, so the names are Arkestro''s vocabulary rather than ours. The spec is not mutated; apply this
  overlay to reproduce the enhancement. These ids are API Evangelist''s proposal and are NOT served by Arkestro.'
