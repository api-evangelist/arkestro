    post:
      summary: create supplier contact
      description: Create a new supplier contact
      tags:
      - supplier contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - supplier_contact
              properties:
                supplier_contact:
                  type: object
                  required:
                  - email
                  - supplier_organization
                  properties:
                    email:
                      type: string
                      format: email
                      description: Email address of the contact
                    first_name:
                      type: string
                      description: First name of the contact
                    last_name:
                      type: string
                      description: Last name of the contact
                    phone:
                      type: string
                      description: Phone number of the contact
                    title:
                      type: string
                      description: Job title of the contact
                    status:
                      type: string
                      description: Status of the contact
                      enum:
                      - pending
                      - approved
                      - rejected
                      - preferred
                      - exists
                    external_id:
                      type: string
                      description: External identifier for the contact
                    supplier_organization:
                      type: object
                      description: 'By ID: Assign the contact to an existing supplier organization by its Arkestro ID.


                        By Name (Deprecated): Will upsert a supplier organization with the provided fields and assign the contact to it.

                        '
                      oneOf:
                      - title: By ID
                        required:
                        - id
                        properties:
                          id:
                            type: integer
                            description: Arkestro ID of an existing supplier organization
                        additionalProperties: false
                      - title: By Name
                        deprecated: true
                        required:
                        - name
                        properties:
                          name:
                            type: string
                            description: Name of the supplier organization
                          external_id:
                            type: string
                            description: External identifier for the supplier organization
                          firm:
                            type: object
                            properties:
                              url:
                                type: string
                                description: URL of the firm associated with the supplier organization
                          address:
                            type: object
                            description: Physical address of the supplier organization
                            properties:
                              line_one:
                                type: string
                                description: First line of the address
                              line_two:
                                type: string
                                description: Second line of the address
                              city:
                                type: string
                                description: City of the address
                              state:
                                type: string
                                description: State of the address
                              country:
                                type: string
                                description: Country of the address
                              postal_code:
                                type: string
                                description: Postal code of the address
                            additionalProperties: false
                        additionalProperties: false
                  additionalProperties: false
              additionalProperties: false
            examples:
