                    supplier_contacts:
                    - id: 123
                      first_name: Sherry
                      last_name: Sedgwick
                      phone: 303-555-5678
                      email: sherry@example.com
                      title: Director of Procurement
                      status: pending
                      external_id: '123456789'
                      supplier_organization:
                        id: 4821
                        name: Sedgwick's Supplies
                        external_id: '987654321'
                        status: approved
                        firm:
                          domain: sedgwick-supplies.com
                        address:
                          line_one: 1234 1st St.
                          line_two: Suite 201
                          city: Denver
                          state: CO
                          country: USA
                          postal_code: '80123'
                    pagination:
                      limit: 1
                      offset: 10
                      total: 122
                      returned_count: 1
