                    - name
                    - external_id
                    - status
                    - firm
                    - address
                    - created_at
                    - updated_at
                    properties:
                      id:
                        type: integer
                        description: Unique identifier for the supplier organization
                      name:
                        type: string
                        description: Name of the supplier organization
                      external_id:
