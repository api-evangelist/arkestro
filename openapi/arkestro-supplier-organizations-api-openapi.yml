                        - string
                        - 'null'
                        description: External identifier for the supplier organization
                      status:
                        type: string
                        description: Status of the supplier organization
                        enum:
                        - pending
                        - approved
                        - rejected
                        - preferred
                        - exists
                      firm:
                        type:
                        - object
                        - 'null'
                        description: Firm associated with the supplier organization. Null for newly created organizations.
                        additionalProperties: false
                        properties:
                          domain:
                            type:
                            - string
                            - 'null'
                            description: Domain of the firm
                      address:
                        type:
                        - object
                        - 'null'
                        description: Physical address of the supplier organization
                        additionalProperties: false
                        properties:
                          line_one:
                            type:
                            - string
                            - 'null'
                            description: First line of the address
                          line_two:
                            type:
                            - string
                            - 'null'
                            description: Second line of the address
                          city:
                            type:
                            - string
                            - 'null'
                            description: City
                          state:
                            type:
                            - string
                            - 'null'
                            description: State or province
                          country:
                            type:
                            - string
                            - 'null'
                            description: Country
                          postal_code:
                            type:
                            - string
                            - 'null'
                            description: Postal or ZIP code
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp when the supplier organization was created
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp when the supplier organization was last updated
              examples:
                basic:
                  summary: With address
                  value:
                    supplier_organization:
                      id: 456
                      name: Acme Industrial Supply
                      external_id: SUP-000123
                      status: pending
                      firm:
                        domain: example.com
                      address:
                        line_one: 123 Market St
                        line_two: Suite 600
                        city: San Francisco
                        state: CA
