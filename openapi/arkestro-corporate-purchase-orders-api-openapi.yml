                    quantity_of_items: '20.5'
                    items_per_unit: 1
                    currency: USD
                    external_id: item_external_id-3
                    category:
                      id: 103
                      code: category-code-3
                      name: Furniture
                      description: Office furniture and fixtures
                    item:
                      id: 1003
                      sku: sku-3
                      name: Office Chair
                      description: Ergonomic office chair with adjustable height
                  pagination:
                    limit: 20
                    offset: 10
                    total: 122
                    returned_count: 20
                pagination:
