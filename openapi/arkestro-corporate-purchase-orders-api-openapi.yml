                        status:
                          type: string
                          description: The status of the PO
                          enum:
                          - paid
                          - unpaid
                        purchased_on:
                          type: string
                          description: The date the purchase order was created
                          format: date
                        spend_category:
                          type:
                          - string
                          - 'null'
                          description: The category of the Purchase Order
                        title:
                          type:
                          - string
                          - 'null'
                          description: The title of the Purchase Order
                        description:
                          type:
                          - string
                          - 'null'
                          description: The description of the purchase order
                        purchasing_org_id:
                          type:
                          - string
                          - 'null'
                          description: The group who budgets for the PO
                        external_division_id:
                          type:
                          - string
                          - 'null'
                          description: The supplier organization ID
                        order_items:
                          type: array
                          items:
                            type: object
                            required:
                            - id
                            - description
                            - price_per_unit
                            - quantity_of_items
                            - items_per_unit
                            - currency
                            - external_id
                            - item
                            - category
                            properties:
                              id:
                                type: integer
                              description:
                                type:
                                - string
                                - 'null'
                                description: The description of a line item
                              price_per_unit:
                                description: The price per unit of an item
                                type:
                                - string
                                - 'null'
                              quantity_of_items:
                                description: The quantity of items being requested
                                type:
                                - string
                                - 'null'
                              items_per_unit:
                                type:
                                - integer
                                - 'null'
                                description: The number of items in a unit
                              currency:
                                type:
                                - string
                                - 'null'
                                description: The currency of the request, using the standard 3 letter code
                              external_id:
                                description: Your ID for an item
                                type:
                                - string
                                - 'null'
                              item:
                                type:
                                - object
                                - 'null'
                                required:
                                - id
                                - sku
                                - name
                                - description
                                properties:
                                  id:
                                    type: integer
                                  sku:
                                    type: string
                                  name:
                                    type:
                                    - string
                                    - 'null'
                                  description:
                                    type:
                                    - string
                                    - 'null'
                              category:
                                type:
                                - object
                                - 'null'
                                required:
                                - id
                                - code
                                - name
                                - description
                                properties:
                                  id:
                                    type: integer
                                  code:
                                    type: string
                                  name:
                                    type:
                                    - string
                                    - 'null'
                                  description:
                                    type:
                                    - string
                                    - 'null'
                            additionalProperties: false
                      additionalProperties: false
