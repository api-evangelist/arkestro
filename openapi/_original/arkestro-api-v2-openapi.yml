                          description: "Base64-encoded MD5 digest of the raw file contents. Used by S3 to\nverify data integrity\
                            \ on upload.\n\n**Ruby:**\n```ruby\nrequire 'digest'\nrequire 'base64'\ndigest = Digest::MD5.digest(File.binread('your_file.pdf'))\n\
                            Base64.strict_encode64(digest)\n```\n\n**Shell (openssl):**\n```bash\nopenssl dgst -md5 -binary\
                            \ your_file.pdf | base64\n```\n\n**Python:**\n```python\nimport hashlib, base64\ndigest = hashlib.md5(open('your_file.pdf',\
                            \ 'rb').read()).digest()\nbase64.b64encode(digest).decode()\n```\n\n**TypeScript (Node.js):**\n\
                            ```typescript\nimport { createHash } from 'crypto';\nimport { readFileSync } from 'fs';\n\nconst\
                            \ checksum = createHash('md5')\n  .update(readFileSync('your_file.pdf'))\n  .digest('base64');\n\
                            ```\n"
                          example: rL0Y20zC+Fzt72VPzMSk2A==
                      additionalProperties: false
                  additionalProperties: false
              additionalProperties: false
            example:
              document:
                name: Updated Supplier Agreement
                approval_required: false
                file:
                  filename: updated_supplier_agreement.pdf
                  content_type: application/pdf
                  byte_size: 204800
                  checksum: rL0Y20zC+Fzt72VPzMSk2A==
