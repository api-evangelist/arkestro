  /api/v2/quote_submissions:
    get:
      summary: list quote submissions
      description: Returns a paginated list of quote submissions. Submissions from suppliers that have been excluded from
        an event are not returned.
      tags:
      - quote submissions
      parameters:
      - name: limit
        in: query
        description: The maximum number of results to return. Defaults to `20`, max `200`.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - name: offset
        in: query
        description: The number of results to skip before starting to collect the result set. Defaults to `0`.
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: sort_order
        in: query
        description: Sort order for `submitted_at` (`asc` for ascending, `desc` for descending). Defaults to `desc`.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: event_id
        in: query
        description: Filter by one or more event IDs (e.g. `?event_id=123` or `?event_id[]=123&event_id[]=456`).
        required: false
        schema:
          type: array
          items:
            type: integer
      - name: status
        in: query
        description: Filter by submission status. `active` returns the most recent submission per supplier (default). `inactive`
          returns previous-round submissions that have been superseded. Pass both to include all (e.g. `?status=active` or
          `?status[]=active&status[]=inactive`).
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - active
            - inactive
          default:
          - active
      - name: archived
        in: query
        description: Filter by archived state. Archived submissions are ones that have been removed from consideration in
          the event by the buyer. Pass both to include all (e.g. `?archived[]=true&archived[]=false`).
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - 'true'
            - 'false'
          default:
          - 'false'
      - name: submitted_at_gte
        in: query
        description: Filter submissions submitted on or after this date. Accepts ISO 8601 format (`YYYY-MM-DD` or `YYYY-MM-DDThh:mm:ssZ`).
        required: false
        schema:
          type: string
          format: date-time
      - name: submitted_at_lte
        in: query
        description: Filter submissions submitted on or before this date. Accepts ISO 8601 format (`YYYY-MM-DD` or `YYYY-MM-DDThh:mm:ssZ`).
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                required:
                - quote_submissions
                - pagination
                properties:
                  quote_submissions:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - status
                      - archived
                      - submitted_at
                      - round_number
                      - total
                      - supplier_contact
                      - event
                      properties:
                        id:
                          type: integer
                          description: The Arkestro ID of the quote submission
                        status:
                          type: string
                          description: The status of the quote submission. `active` is the most recent submission per supplier.
                            `inactive` indicates a previous-round submission that has been superseded.
                          enum:
                          - active
                          - inactive
                          example: active
                        archived:
                          type: boolean
                          description: Whether the submission has been archived (removed from consideration) by the buyer.
                          example: false
                        submitted_at:
                          type: string
                          format: date-time
                          description: The timestamp when the quote was submitted
                        round_number:
                          type: integer
                          description: The round number of the quote submission
                        total:
                          type:
                          - string
                          - 'null'
                          description: The sum of all line item totals in the quote submission, represented as a decimal string
                            in the event's base currency. Null when no line items have been priced.
                          example: '150000.00'
                        supplier_contact:
                          type:
                          - object
                          - 'null'
                          required:
                          - id
                          - external_id
                          - first_name
                          - last_name
                          - email
                          - supplier_organization
                          properties:
                            id:
                              type: integer
                              description: The Arkestro ID of the supplier contact
                            external_id:
                              type:
                              - string
                              - 'null'
                              description: The external ID of the supplier contact
                            first_name:
                              type:
                              - string
                              - 'null'
                              description: First name of the supplier contact
                            last_name:
                              type:
                              - string
                              - 'null'
                              description: Last name of the supplier contact
                            email:
                              type:
                              - string
                              - 'null'
                              description: Email of the supplier contact
                            supplier_organization:
                              type: object
                              required:
                              - id
                              - external_id
                              - name
                              properties:
                                id:
                                  type: integer
                                  description: The Arkestro ID of the supplier organization
                                external_id:
                                  type:
                                  - string
                                  - 'null'
                                  description: The external ID of the supplier organization
                                name:
                                  type:
                                  - string
                                  - 'null'
                                  description: The name of the supplier organization
                              additionalProperties: false
                          additionalProperties: false
                        event:
                          type: object
                          required:
                          - id
                          - external_id
                          - name
                          - status
                          properties:
                            id:
                              type: integer
                              description: The Arkestro ID of the event
                            external_id:
                              type:
                              - string
                              - 'null'
                              description: The external ID of the event
                            name:
                              type: string
                              description: The name of the event
                            status:
                              type: string
                              description: The current status of the event
                              enum:
                              - draft
                              - open_for_questions
                              - open_for_bidding
                              - closed
                              - ready_to_award
                              - awarded
                              - unawarded
                              example: open_for_bidding
                          additionalProperties: false
                      additionalProperties: false
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                        description: The number of records requested.
                      offset:
                        type: integer
                        description: The number of records skipped after filtering and sorting.
                      total:
                        type: integer
                        description: The total number of records available after filtering.
                      returned_count:
                        type: integer
                        description: The number of records returned in the current response.
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: string
        '403':
