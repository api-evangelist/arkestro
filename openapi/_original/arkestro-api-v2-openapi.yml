                          Upload the file with a PUT request to this URL; if the document already has an attached file, the
                          uploaded file replaces it. The signed URL enforces that the uploaded Content-MD5 matches the checksum
                          provided in the request.
                        example: https://your-bucket.s3.amazonaws.com/uploads/...
                    additionalProperties: false
