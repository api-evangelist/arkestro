    post:
      summary: create document
      tags:
      - event documents
      parameters:
      - name: event_id
        in: path
        description: The ID of the event
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - document
              properties:
                document:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: The name of the document
                    external_id:
                      type: string
                      description: An optional external identifier for the document, unique within the event
                    description:
                      type: string
                      description: An optional description of the document
                    will_accept_submissions:
                      type: boolean
                      description: Whether suppliers are requested to submit a document. Set to false when uploading a document
                        for supplier review only. Cannot be true when `consent_required` is true — a document either collects
                        a supplier file submission or requires consent acknowledgement, not both. Required to be true when
                        `submission_required` is true.
                    submission_required:
                      type: boolean
                      description: Whether suppliers must submit a document in order to participate in this event. Requires
                        `will_accept_submissions` to be true — there must be a mechanism for the supplier to fulfill the requirement.
                        Required to be true when `approval_required` is true.
                    approval_required:
                      type: boolean
                      description: Whether each supplier's submission must be reviewed and approved by a buyer before the
                        supplier is granted access to event details. Requires `submission_required` to be true — there must
                        be a submission for the buyer to approve.
                    blocks_access:
                      type: boolean
                      description: Whether a supplier must complete this document's requirement before they can access other
                        documents uploaded for this event. Requires at least one of `consent_required` or `approval_required`
                        to be true — the supplier must have a mechanism to unblock themselves.
                    consent_required:
                      type: boolean
                      description: Whether suppliers must consent to this document before they can access other documents
                        uploaded for this event. Cannot be true when `will_accept_submissions` is true — consent and file
                        submission are mutually exclusive flows.
                    file:
                      type: object
                      description: 'Optional file metadata for direct upload to S3. When provided, all sub-fields are required.
                        On success, the response includes a presigned `upload_url` to PUT the file directly to S3.

                        '
                      required:
                      - filename
                      - content_type
                      - byte_size
                      - checksum
                      properties:
                        filename:
                          type: string
                          description: Filename to assign to the uploaded file, including its extension.
                          example: supplier_agreement.pdf
                        content_type:
                          type: string
                          description: MIME type. Executable content types (e.g. application/x-msdownload) are not permitted.
                          example: application/pdf
                        byte_size:
                          type: integer
                          description: File size in bytes. Maximum 5 GiB (5,368,709,120 bytes).
                          example: 204800
                        checksum:
                          type: string
                          description: "Base64-encoded MD5 digest of the raw file contents. Used by S3 to\nverify data integrity\
                            \ on upload.\n\n**Ruby:**\n```ruby\nrequire 'digest'\nrequire 'base64'\ndigest = Digest::MD5.digest(File.binread('your_file.pdf'))\n\
                            Base64.strict_encode64(digest)\n```\n\n**Shell (openssl):**\n```bash\nopenssl dgst -md5 -binary\
                            \ your_file.pdf | base64\n```\n\n**Python:**\n```python\nimport hashlib, base64\ndigest = hashlib.md5(open('your_file.pdf',\
                            \ 'rb').read()).digest()\nbase64.b64encode(digest).decode()\n```\n\n**TypeScript (Node.js):**\n\
                            ```typescript\nimport { createHash } from 'crypto';\nimport { readFileSync } from 'fs';\n\nconst\
                            \ checksum = createHash('md5')\n  .update(readFileSync('your_file.pdf'))\n  .digest('base64');\n\
                            ```\n"
                          example: rL0Y20zC+Fzt72VPzMSk2A==
                      additionalProperties: false
                  additionalProperties: false
              additionalProperties: false
            examples:
              without_file:
                summary: Document without a file attachment
                value:
                  document:
                    name: Supplier Agreement
                    description: Please review and sign the attached agreement.
                    will_accept_submissions: true
                    submission_required: true
                    approval_required: true
                    blocks_access: true
                    consent_required: false
              with_file:
                summary: Document with a file for direct upload
                value:
                  document:
                    name: Supplier Agreement
                    description: Please review and sign the attached agreement.
                    will_accept_submissions: true
                    submission_required: true
                    approval_required: true
                    blocks_access: true
                    consent_required: false
                    file:
                      filename: supplier_agreement.pdf
                      content_type: application/pdf
                      byte_size: 204800
                      checksum: rL0Y20zC+Fzt72VPzMSk2A==
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    required:
                    - id
                    - name
                    - description
                    - filename
                    - approval_required
                    - blocks_access
                    - consent_required
                    - submission_required
                    - will_accept_submissions
                    properties:
                      id:
                        type: integer
                        description: The Arkestro ID of the document
                      external_id:
                        type:
                        - string
                        - 'null'
                        description: An optional external identifier for the document, unique within the event
                      name:
                        type: string
                        description: The name of the document
                      description:
                        type:
                        - string
                        - 'null'
                        description: An optional description of the document
                      filename:
                        type:
                        - string
                        - 'null'
                        description: The filename of the attached file, if one has been uploaded
                      will_accept_submissions:
                        type:
                        - boolean
                        - 'null'
                        description: Whether suppliers are requested to submit a document. Set to false when uploading a document
                          for supplier review only.
                      submission_required:
                        type: boolean
                        description: Whether suppliers must submit a document in order to participate in this event.
                      approval_required:
                        type: boolean
                        description: Whether each supplier's submission must be reviewed and approved by a buyer before the
                          supplier is granted access to event details.
                      blocks_access:
                        type: boolean
                        description: Whether a supplier's submission must be approved by a buyer before the supplier can access
                          other documents uploaded for this event.
                      consent_required:
                        type: boolean
                        description: Whether suppliers must consent to this document before they can access other documents
                          uploaded for this event.
                      upload_url:
                        type: string
                        description: Presigned S3 PUT URL. Only present when `file` metadata was supplied in the request.
                          Upload the file with a PUT request to this URL; if the document already has an attached file, the
                          uploaded file replaces it. The signed URL enforces that the uploaded Content-MD5 matches the checksum
                          provided in the request.
                        example: https://your-bucket.s3.amazonaws.com/uploads/...
                    additionalProperties: false
                additionalProperties: false
              examples:
                without_file:
                  summary: Document created without a file attachment
                  value:
                    document:
                      id: 1
                      external_id: ext-123
                      name: Supplier Agreement
                      description: Please review and sign the attached agreement.
                      filename: null
                      will_accept_submissions: true
                      submission_required: true
                      approval_required: true
                      blocks_access: true
                      consent_required: false
                with_file:
                  summary: Document created with a file — includes presigned upload URL
                  value:
                    document:
                      id: 1
                      external_id: ext-123
                      name: Supplier Agreement
                      description: Please review and sign the attached agreement.
                      filename: supplier_agreement.pdf
                      will_accept_submissions: true
                      submission_required: true
                      approval_required: true
                      blocks_access: true
