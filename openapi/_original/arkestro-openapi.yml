webhooks:
  award.granted:
    post:
      summary: award.granted
      operationId: awardGrantedWebhook
      security: []
      tags:
      - Webhooks
      description: |-
        Fired when an award is finalized on an event. The `data.award` payload
        is identical to the award returned by `GET /api/v2/events/{id}/award`,
        so webhook consumers and pollers of that endpoint always see the same
        shape.

        Every delivery is signed — see the introduction of this section for how
        to verify the signature headers, how to respond, and the retry
        schedule.
      parameters:
      - name: X-Arkestro-Signature
        in: header
        required: true
        schema:
          type: string
        description: One or more HMAC-SHA256 signatures of the request, each formatted
          `sha256=<hex>` and joined by commas with no whitespace. Multiple values
          appear during secret rotation.
        example: sha256=5d61a7b19c1c1b2f9a4408c1a3ee7dcd2f1c5b7e9a0d3f6c8b2e4a1d7c9f0b3a
      - name: X-Arkestro-Timestamp
        in: header
        required: true
        schema:
          type: string
        description: The Unix timestamp (epoch seconds, as a string) at which the
          request was signed. Part of the signed payload.
        example: '1748290800'
      - name: X-Arkestro-Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: A UUID identifying the delivery event. It stays constant across
          all retry attempts of the delivery (unlike `request_id` in the body, which
          changes on every attempt), so use it to deduplicate retries.
        example: 0b8a4f7d-2e61-4c3b-9d05-8f6a1c2e4b7d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": components/schemas/award_granted_webhook_payload.yaml
            examples:
              basic:
                value:
                  webhook_event: award.granted
                  request_id: 6f1c2b6e-9d3a-4f5b-8a90-2c7e4d1b5f03
                  data:
                    award:
                      id: 501
                      award_format: by_line_item
                      awarded_at: '2026-04-01T19:07:00Z'
                      event:
                        id: 118996
                        name: ERF013338 200007902
                        currency: USD
                        external_id: ERF013338
                        business_unit:
                          id: 1
                          name: Midwest
                          unique_name: Midwest Processing Co 123
                        custom_value_fields:
                        - id: 1
                          type_text: Site ID
                          value_text: CSD-1053
                      awarded_line_items:
                      - line_item_id: 7734
                        quote_submission_id: 9821
                        quote_submission_lot_id: 3307
                        quote_submission_line_item_id: 44120
                        name: hammers
                        total: '1000.00'
                        quoted_price_per_unit: '100.00'
                        awarded_quantity_of_units: '10'
                        quoted_quantity_of_units: '10'
                        unit_of_measure: each
                        supplier_provided_price: '2050.00'
                        supplier_provided_discount: '5.0'
                        quoting_currency: MXN
                        supplier_contact:
                          id: 3301
                          first_name: Hank
                          last_name: Hammersmith
                          email: hank@acmehammers.com
                          external_id: contact-77
                          supplier_organization:
                            id: 205
                            name: Acme Hammers Inc.
                            external_id: sup123
      responses:
        2XX:
          description: Acknowledge the delivery with any `2xx` status code within
            10 seconds; the response body is ignored. `429` and `5xx` responses, timeouts,
            and connection errors are retried with exponential backoff; any other
            non-`2xx` response discards the delivery permanently.
